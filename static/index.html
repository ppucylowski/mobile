<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#315f4d">
  <meta name="description" content="A calm ADHD planner for assignments, work shifts, and taking one small step at a time.">
  <title>Today · ADHD Planner</title>
  <style>
    :root { color-scheme: light; --ink:#202d29; --muted:#63726b; --green:#315f4d; --pale:#e4eee7; --canvas:#f7f8f3; --line:#e4eae4; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--ink); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:1rem; line-height:1.5; }
    a { color:var(--green); text-underline-offset:.2em; }
    button,input { font:inherit; } button,a,input { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; } :focus-visible { outline:3px solid #b06c28; outline-offset:4px; }
    .skip { position:absolute; top:-100px; left:1rem; padding:.8rem; background:white; z-index:10; } .skip:focus { top:1rem; }
    main { width:100%; max-width:44rem; margin:auto; padding:calc(1.5rem + env(safe-area-inset-top)) 1.4rem 2rem; min-height:75vh; }
    h1,h2,h3,p { margin:0; } h1 { font-size:1.85rem; line-height:1.2; letter-spacing:-.04em; margin:.5rem 0; } h2 { font-size:1.2rem; line-height:1.4; } h3 { font-size:1rem; } p { overflow-wrap:anywhere; }
    .header { display:flex; align-items:flex-start; gap:.75rem; } .header-copy { flex:1; min-width:0; }
    .date,.eyebrow { font-size:.8rem; font-weight:700; letter-spacing:.08em; } .date { color:var(--green); text-transform:uppercase; }
    .subtitle,.detail { color:var(--muted); } .subtitle { margin-top:.35rem; } .detail { font-size:.9rem; margin-top:.2rem; }
    .settings { display:grid; place-items:center; min-width:2.75rem; min-height:2.75rem; text-decoration:none; border-radius:50%; background:var(--pale); font-size:1.5rem; }
    section { margin-top:1.8rem; } .section-heading { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:.5rem 1rem; margin-bottom:.8rem; }
    .section-heading a { font-size:.9rem; font-weight:600; padding:.3rem 0; } .count { color:var(--muted); font-size:.9rem; }
    .next { background:var(--green); color:white; border-radius:1.4rem; padding:1.4rem; } .eyebrow { color:#cee1d4; } .next h3 { font-size:1.45rem; line-height:1.3; margin:.5rem 0; } .next p { color:#e1ede5; }
    .pill { display:inline-block; padding:.5rem .7rem; background:#477563; border-radius:.75rem; font-size:.85rem; margin-top:1rem; }
    ul { list-style:none; margin:0; padding:0; } .row { display:flex; align-items:center; gap:.75rem; padding:1rem 0; border-bottom:1px solid var(--line); } .row-copy { flex:1; min-width:0; } .duration,.tag { font-size:.85rem; color:var(--muted); } .tag { font-weight:700; }
    .event-mark { width:.25rem; border-radius:.25rem; background:#8caa97; align-self:stretch; flex-shrink:0; } .work { background:#d5a46c; } .time { color:var(--green); font-size:.85rem; font-weight:700; margin-bottom:.2rem; }
    .task-label { display:flex; align-items:center; gap:.75rem; flex:1; min-width:0; cursor:pointer; min-height:2.75rem; } input[type=checkbox] { flex-shrink:0; width:1.4rem; height:1.4rem; accent-color:var(--green); margin:0; } .task-title { display:block; font-weight:600; } .task-label input:checked + span .task-title { text-decoration:line-through; color:var(--muted); }
    progress { display:block; appearance:none; border:0; border-radius:1rem; overflow:hidden; background:#e3ece5; width:100%; height:.6rem; } progress::-webkit-progress-bar { background:#e3ece5; } progress::-webkit-progress-value { background:#6f9d7d; border-radius:1rem; } progress::-moz-progress-bar { background:#6f9d7d; border-radius:1rem; }
    .encouragement { color:var(--muted); font-size:.9rem; margin-top:.7rem; } .demo { text-align:center; font-size:.8rem; color:var(--muted); margin-top:1.5rem; }
    nav { position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom)); z-index:2; } .nav-inner { max-width:44rem; margin:auto; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.25rem; } nav a { display:flex; flex-direction:column; align-items:center; justify-content:center; text-decoration:none; padding:.45rem .15rem; min-height:3.4rem; color:var(--muted); border-radius:.7rem; font-size:.85rem; overflow-wrap:anywhere; text-align:center; } nav a[aria-current=page] { color:var(--green); background:var(--pale); font-weight:700; } .nav-icon { font-size:1.3rem; line-height:1.3; }
    .button { display:inline-block; padding:.7rem 1rem; border:1px solid var(--green); border-radius:.7rem; background:var(--green); color:white; text-decoration:none; margin-top:1rem; }
    .setting-row { margin-top:1.5rem; } .status { min-height:1.5em; color:var(--muted); margin-top:1rem; font-size:.9rem; } .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(min-width:48rem) { main { padding-top:3rem; } h1 { font-size:2.1rem; } .next { padding:1.7rem; } }
    @media(max-width:23rem) { main { padding-inline:1rem; } .row { flex-wrap:wrap; } .duration { margin-left:2.15rem; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main" tabindex="-1"></main>
  <nav aria-label="Main navigation"><div class="nav-inner">
    <a href="#today" data-route="today"><span class="nav-icon" aria-hidden="true">◉</span>Today</a>
    <a href="#calendar" data-route="calendar"><span class="nav-icon" aria-hidden="true">▦</span>Calendar</a>
    <a href="#tasks" data-route="tasks"><span class="nav-icon" aria-hidden="true">✓</span>Tasks</a>
    <a href="#progress" data-route="progress"><span class="nav-icon" aria-hidden="true">◔</span>Progress</a>
  </div></nav>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <noscript><p style="padding:1rem">Please enable JavaScript to use the planner.</p></noscript>
  <script>
    'use strict';
    // Rendering is separate from plain data and storage, so persistence can be replaced later.
    const taskSeed = [
      { id:'1', title:'Outline psychology paper', detail:'Research methods · Due tomorrow', duration:'20 min', completed:false },
      { id:'2', title:'Submit reading response', detail:'English literature · Due today', duration:'15 min', completed:true },
      { id:'3', title:'Review biology notes', detail:'Biology · Due Friday', duration:'25 min', completed:false }
    ];
    const events = [
      { title:'Reading response due', time:'11:59 AM', detail:'English literature', kind:'assignment' },
      { title:'Work shift', time:'2:00 PM – 6:00 PM', detail:'Campus café', kind:'work' }
    ];
    const storageKey = 'adhd-planner-completed-v1';
    let storageAvailable = true;
    const tasks = taskSeed.map(task => ({ ...task }));
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
      if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
        tasks.forEach(task => { if (typeof saved[task.id] === 'boolean') task.completed = saved[task.id]; });
      }
    } catch { storageAvailable = false; }
    const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const main = document.getElementById('main');
    const titles = { today:'One thing at a time.', calendar:'Calendar', tasks:'Tasks', progress:'Your progress', settings:'Settings' };
    function currentRoute() { const route = location.hash.slice(1); return Object.hasOwn(titles, route) ? route : 'today'; }
    function taskCard(task) {
      return `<li class="row"><label class="task-label"><input type="checkbox" data-task="${task.id}" ${task.completed ? 'checked' : ''}><span class="row-copy"><span class="task-title">${escapeHTML(task.title)}</span><span class="detail">${escapeHTML(task.detail)}</span></span></label><span class="duration">${task.duration}</span></li>`;
    }
    function eventCard(event) {
      return `<li class="row"><span class="event-mark ${event.kind === 'work' ? 'work' : ''}" aria-hidden="true"></span><div class="row-copy"><p class="time">${event.time}</p><h3>${event.title}</h3><p class="detail">${event.detail}</p></div><span class="tag">${event.kind === 'work' ? 'WORK' : 'DUE'}</span></li>`;
    }
    function progressSummary() {
      const completed = tasks.filter(task => task.completed).length;
      return `<div class="section-heading"><h2>Your progress</h2><span class="count">${completed} of ${tasks.length} tasks</span></div><progress aria-label="Tasks completed" max="${tasks.length}" value="${completed}">${completed} of ${tasks.length}</progress><p class="encouragement">Every little step counts.</p>`;
    }
    function nextAction() {
      const task = tasks.find(task => !task.completed);
      return `<article class="next"><div class="eyebrow">A GOOD PLACE TO START</div><h3>${task ? task.title : 'You’ve done enough for today.'}</h3><p>${task ? 'Just start with a small step. You’ve got this.' : 'All your example tasks are complete. Make a little room for rest.'}</p>${task ? `<div class="pill">${task.duration} · ${task.detail}</div>` : ''}</article>`;
    }
    function render(moveFocus = false) {
      const route = currentRoute();
      const date = new Intl.DateTimeFormat(undefined, { weekday:'long', month:'long', day:'numeric' }).format(new Date());
      const header = `<header class="header"><div class="header-copy"><p class="date">${date}</p><h1>${titles[route]}</h1><p class="subtitle">${route === 'today' ? 'Let’s make today feel a little lighter.' : 'A little structure. More room to breathe.'}</p></div>${route !== 'settings' ? '<a class="settings" href="#settings" aria-label="Settings">⚙</a>' : ''}</header>`;
      let content = '';
      if (route === 'today') content = `<section aria-label="Your next step"><div class="section-heading"><h2>Your next step</h2></div>${nextAction()}</section><section><div class="section-heading"><h2>Today’s schedule</h2><a href="#calendar">View calendar</a></div><ul>${events.map(eventCard).join('')}</ul></section><section aria-label="Progress summary">${progressSummary()}</section><section><div class="section-heading"><h2>On your plate</h2><a href="#tasks">All tasks</a></div><ul>${tasks.map(taskCard).join('')}</ul></section>`;
      if (route === 'calendar') content = `<section><div class="section-heading"><h2>Today’s schedule</h2></div><ul>${events.map(eventCard).join('')}</ul><p class="encouragement">Month and week views are planned for a future update.</p></section>`;
      if (route === 'tasks') content = `<section><div class="section-heading"><h2>Assignments</h2></div><ul>${tasks.map(taskCard).join('')}</ul></section>`;
      if (route === 'progress') content = `<section>${progressSummary()}</section><section><h2>Small steps add up.</h2><p class="encouragement">This summary reflects your example tasks. Historical progress will be available in a future update.</p></section>`;
      if (route === 'settings') content = `<section><h2>Task storage</h2><p class="encouragement">${storageAvailable ? 'Task completion is saved in this browser on this device.' : 'Browser storage is unavailable. Changes will last for this session only.'}</p><p class="encouragement">Your browser controls text size and zoom.</p><button class="button" id="reset">Reset example tasks</button><p class="status" id="save-status" role="status"></p><a href="#today">Back to Today</a></section>`;
      main.innerHTML = header + content + '<p class="demo">Example schedule and tasks</p>';
      document.title = `${route.charAt(0).toUpperCase() + route.slice(1)} · ADHD Planner`;
      document.querySelectorAll('[data-route]').forEach(link => {
        if (link.dataset.route === route) link.setAttribute('aria-current','page'); else link.removeAttribute('aria-current');
      });
      if (moveFocus) { main.focus(); window.scrollTo(0,0); }
    }
    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify(Object.fromEntries(tasks.map(task => [task.id,task.completed])))); return true; }
      catch { storageAvailable = false; return false; }
    }
    main.addEventListener('change', event => {
      const input = event.target;
      if (!(input instanceof HTMLInputElement) || !input.dataset.task) return;
      const task = tasks.find(task => task.id === input.dataset.task);
      if (!task) return;
      task.completed = input.checked;
      const persisted = save();
      const id = task.id;
      render();
      main.querySelector(`[data-task="${id}"]`).focus();
      document.getElementById('announcement').textContent = `${task.title} marked ${task.completed ? 'complete' : 'incomplete'}.${persisted ? '' : ' Could not save to browser storage.'}`;
    });
    main.addEventListener('click', event => {
      if (!(event.target instanceof Element) || !event.target.closest('#reset')) return;
      tasks.forEach((task,index) => { task.completed = taskSeed[index].completed; });
      const persisted = save();
      render();
      document.getElementById('reset').focus();
      document.getElementById('save-status').textContent = persisted ? 'Example tasks reset.' : 'Tasks reset for this session. Browser storage is unavailable.';
    });
    window.addEventListener('hashchange', () => render(true));
    render();
  </script>
</body>
</html>
